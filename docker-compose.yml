services:
  postgres:
    image: postgres:16-alpine
    container_name: school37-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school37
      POSTGRES_PASSWORD: school37
      POSTGRES_DB: school37
    ports:
      - "5432:5432"
    volumes:
      - school37_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school37 -d school37"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school37_pg:
